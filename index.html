<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14131a" />
    <title>krunkedtato</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111018;
        color: #f4f2ec;
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #game-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #touch-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 30;
      }
      #dev-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="touch-root"></div>
      <div id="ui-root"></div>
      <div id="dev-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
